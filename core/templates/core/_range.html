<form class="d-filter" method="get">
 <span class="d-chip flat" title="{% if snapshot %}Saved snapshot generated {{ snapshot.generated_at|date:'M j, Y H:i' }}{% if snapshot.generated_by %} by {{ snapshot.generated_by }}{% endif %}.{% else %}Live data &mdash; not saved. A manager can generate a saved snapshot for this range.{% endif %}">{% if snapshot %}Saved{% else %}Live data{% endif %}</span>
 <label>Report
  <select name="report" onchange="this.form.submit()">
   <option value="">Live / custom range</option>
   {% for s in snapshots %}
   <option value="{{ s.pk }}"{% if snapshot and snapshot.pk == s.pk %} selected{% endif %}>{{ s.title|default:s.module }} &middot; {{ s.range_start|date:"M j, Y" }} &ndash; {{ s.range_end|date:"M j, Y" }}</option>
   {% endfor %}
  </select>
 </label>
 <noscript><button type="submit">View</button></noscript>
 {% if can_manage and snapshot %}
 <a class="d-btn" href="{{ edit_url }}">Edit stored report</a>
 {% endif %}
 {% if manage_url %}
 <a href="{{ manage_url }}">Manage saved reports</a>
 {% endif %}
</form>
<form class="d-filter" method="get" id="report-range">
 <label>From <input type="date" name="from" value="{{ w_from }}"></label>
 <label>To <input type="date" name="to" value="{{ w_to }}"></label>
 <button type="submit">Apply</button>
 {% if can_manage %}
 <button type="submit" form="report-generate">{% if snapshot %}Regenerate report{% else %}Generate report{% endif %}</button>
 {% endif %}
 <a href="?report=">Live / reset</a>
</form>
{% if can_manage %}
<form id="report-generate" method="post" action="{% url 'report_generate' tab %}" hidden>
 {% csrf_token %}
 <input type="hidden" name="from" value="{{ w_from }}">
 <input type="hidden" name="to" value="{{ w_to }}">
</form>
<script>
(function () {
 var generate = document.getElementById("report-generate");
 var range = document.getElementById("report-range");
 if (!generate || !range) return;
 generate.addEventListener("submit", function () {
  generate.querySelector('[name="from"]').value = range.querySelector('[name="from"]').value;
  generate.querySelector('[name="to"]').value = range.querySelector('[name="to"]').value;
 });
})();
</script>
{% endif %}
